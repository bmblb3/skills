schema_version: "1.1"
name: backlog-triage-mixed
expected_outcome: |
  The response is a single table that gives every backlog item, plus the existing
  recurring-invoices feature, a verdict (Cut, Simplify or Keep), with at most one
  sentence after it. CSV export and the Ctrl+S fix are kept. The plugin system,
  real-time collaboration and the report builder are cut or simplified, each with a
  workaround or a small first piece. Recurring invoices is judged on usage and cost
  rather than kept by default. The whole response is under about 250 words.
