schema_version: "1.1"
name: backlog-triage-mixed
expected_outcome: |
  The response opens with a summary table and gives every backlog item, plus the
  existing recurring-invoices feature, its own verdict (Cut, Simplify or Keep).
  CSV export and the Ctrl+S fix are kept. The plugin system, real-time collaboration
  and the report builder are cut or simplified, each with a workaround or a small
  first slice (for example, CSV export covering the accountant and reporting needs).
  Recurring invoices is judged on usage and cost rather than kept by default.
