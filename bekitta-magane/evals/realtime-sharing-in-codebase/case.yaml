schema_version: "1.1"
name: realtime-sharing-in-codebase
expected_outcome: |
  The response reads the code before judging. It gives a Cut or Simplify verdict,
  citing files that show why real-time sharing is invasive (single-user local JSON
  storage in todo/storage.py, no owner or version fields in todo/models.py). It
  points to existing features as the workaround: the TODO_FILE environment variable
  (a list in a shared folder or git repo) and/or the export and import commands.
context:
  scaffold_script: place-files.sh
