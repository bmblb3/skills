schema_version: "1.1"
name: vague-theme-editor-request
expected_outcome: |
  The response does not greenlight a full theme editor. It gives a Simplify verdict
  whose first piece is a small, well-known feature such as a dark mode toggle, with
  the full editor deferred (or, if it asks questions instead, at most two). It is
  short, about 100 words, and written in plain product language with no
  implementation detail. It is written in Simplified Technical English: short
  sentences, active voice, instructions as commands, and no idioms or contractions.
